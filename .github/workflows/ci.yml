# =============================================================================
# CI — Linux (GCC) + Windows (MSVC) + Linux aarch64 cross-compile.
#
# Milestones:
#   M2: the same source builds and passes ctest on Linux and Windows, with
#       platform-specific code confined to src/platform/linux and
#       src/platform/windows (see docs/build.md).
#   M3: SDL3 window + Vulkan. Linux CI installs SDL3 + lavapipe and runs the
#       demo headless (Xvfb) with validation layers; a VUID in the log fails
#       the build. Windows MSVC pulls SDL3 via FetchContent; the Vulkan unit
#       test skips on runners without a Vulkan ICD.
#
# third_party/petari is vendored (not a submodule) per M1 decision; if you
# later switch it to a submodule, enable `submodules: recursive` below.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: Linux (GCC, x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl3-dev xvfb vulkan-validationlayers

      - name: Configure
        run: cmake -B build -DPLATFORM=PC -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build

      - name: Test (unit + headless Vulkan via lavapipe)
        run: ctest --test-dir build --output-on-failure

      # M3 smoke test: run the real windowed demo headless for 120 frames with
      # validation layers; any Vulkan spec violation (VUID) fails the build.
      - name: Demo smoke test (Xvfb + validation)
        run: |
          xvfb-run -a ./build/src/galaxy-pc --frames 120 --gpu-debug --log-file /tmp/demo.log
          if grep -q "VUID" /tmp/demo.log; then
            echo "::error::Vulkan validation VUIDs found (see /tmp/demo.log)"
            grep -c "VUID" /tmp/demo.log
            exit 1
          fi
          echo "Demo ran clean (no VUIDs)"

  windows:
    name: Windows (MSVC, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Visual Studio 2022 (MSVC) + CMake + Ninja are preinstalled; the Vulkan
      # SDK is preinstalled on windows-latest. SDL3 is fetched from source.
      - name: Configure
        run: cmake -B build -DPLATFORM=PC

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-aarch64-cross:
    # Compile-only check for the Steam Deck / ARM64 Linux target (M2 optional).
    name: Linux (cross, aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aarch64 toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu ninja-build libvulkan-dev

      - name: Configure
        run: cmake -B build-arm64 -DPLATFORM=PC -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-LinuxAArch64.cmake

      - name: Build
        run: cmake --build build-arm64
